name: asai_local_app
description: Aplicativo de gestión para locales comerciales — chatbot WhatsApp visual
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0

  # Permisos y plataforma
  permission_handler: ^11.3.0   # Android / iOS / macOS
  geolocator: ^11.0.0           # GPS multiplataforma
  image_picker: ^1.0.7          # Cámara / galería

  # UI
  go_router: ^13.2.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  dotted_border: ^2.1.0         # slot vacío del catálogo

  # Utilidades
  intl: ^0.19.0                 # formateo de horarios
  uuid: ^4.3.3

dependency_overrides: {}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
