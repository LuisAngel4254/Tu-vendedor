name: app_vendedor
description: Aplicativo de gestión para locales comerciales — Tu Vendedor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # Permisos y plataforma
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7

  # UI
  provider: ^6.1.2
  cached_network_image: ^3.3.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
