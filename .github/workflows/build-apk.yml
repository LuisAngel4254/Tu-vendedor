APK: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Instalar dependencias
        working-directory: app_vendedor
        run: flutter pub get

      - name: Compilar APK debug
        working-directory: app_vendedor
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: tu-vendedor-debug
          path: app_vendedor/build/outputs/flutter-apk/app-debug.apk
          retention-days: 7
